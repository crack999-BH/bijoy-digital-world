function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function options(correct){
 const wrong=shuffle(bank.filter(x=>x[1]!==correct)).slice(0,3).map(x=>x[1]);
 return shuffle([correct,...wrong]);
}
function build(){
 current=shuffle(bank).slice(0,40);
 const qz=document.getElementById("quiz");qz.innerHTML="";
 current.forEach((x,i)=>{
  const box=document.createElement("div");box.className="q";
  box.innerHTML="<b>"+(i+1)+". 「"+x[0]+"」 এর সঠিক বাংলা অর্থ কোনটি?</b>";
  options(x[1]).forEach((text,j)=>{
   const lab=document.createElement("label");lab.className="opt";
   const input=document.createElement("input");input.type="radio";input.name="q"+i;input.value=text;
   lab.appendChild(input);lab.appendChild(document.createTextNode(" "+letters[j]+". "+text));
   lab.onclick=()=>{box.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));lab.classList.add("sel")};
   box.appendChild(lab);
  });qz.appendChild(box);
 });
 const b=document.createElement("button");b.textContent="✅ সব উত্তর দেওয়া শেষ — SUBMIT";b.onclick=check;qz.appendChild(b);
}
function check(){
 let score=0,answered=0,review="";
 current.forEach((x,i)=>{
  const sel=document.querySelector('input[name="q'+i+'"]:checked'),opts=document.querySelectorAll('input[name="q'+i+'"]');
  if(sel){answered++;if(sel.value===x[1]){score++;sel.parentElement.classList.add("ok")}else sel.parentElement.classList.add("no")}
  opts.forEach(o=>{if(o.value===x[1])o.parentElement.classList.add("ok")});
  review+=sel&&sel.value===x[1]?'<div class="review"><b>Q'+(i+1)+':</b> ✅ সঠিক</div>':'<div class="review"><b>Q'+(i+1)+':</b> ❌ তোমার উত্তর: '+(sel?sel.value:"দেওয়া হয়নি")+'<br>✅ সঠিক: '+x[1]+'</div>';
 });
 const pct=Math.round(score/current.length*100),msg=pct>=90?"🔥 অসাধারণ!":pct>=75?"👏 খুব ভালো!":pct>=60?"👍 ভালো!":"📚 আরও practice দরকার!";
